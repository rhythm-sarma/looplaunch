<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 990" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ah-sm" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1240" height="990" fill="#fff"/>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle">
    <tspan font-size="20" font-weight="bold" fill="#1a1a1a">LOOP LAUNCH</tspan>
    <tspan font-size="14" fill="#666"> — System Architecture</tspan>
  </text>

  <!-- ================================================================ -->
  <!-- 01  USER / BUSINESS CONTEXT                                      -->
  <!-- ================================================================ -->
  <rect x="245" y="50" width="490" height="60" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="490" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">01 · USER / BUSINESS CONTEXT</text>
  <text x="490" y="90" text-anchor="middle" font-size="9.5" fill="#555">Customers · Problem · USP / Positioning · Competitors · Business Model · Goals</text>

  <!-- Arrow 01 → 02 -->
  <line x1="490" y1="110" x2="490" y2="148" stroke="#444" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="504" y="137" font-size="8" fill="#888">business context</text>

  <!-- ================================================================ -->
  <!-- 02  BACKEND / AGENT ORCHESTRATOR                                 -->
  <!-- ================================================================ -->
  <rect x="170" y="152" width="640" height="76" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="490" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">02 · BACKEND / AGENT ORCHESTRATOR</text>
  <text x="490" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Central Pipeline Controller</text>
  <text x="490" y="214" text-anchor="middle" font-size="9" fill="#555">Tool selection · Research sequencing · Data processing · Storage · Framework execution · Answer delivery</text>

  <!-- Arrow 02 → Tools bus -->
  <line x1="490" y1="228" x2="490" y2="248" stroke="#444" stroke-width="1.2"/>
  <text x="504" y="244" font-size="8" fill="#888">research requests</text>

  <!-- Fan-out bus to tools -->
  <line x1="170" y1="248" x2="810" y2="248" stroke="#555" stroke-width="1.2"/>
  <line x1="170" y1="248" x2="170" y2="264" stroke="#555" stroke-width="1.2"/>
  <line x1="330" y1="248" x2="330" y2="264" stroke="#555" stroke-width="1.2"/>
  <line x1="490" y1="248" x2="490" y2="264" stroke="#555" stroke-width="1.2"/>
  <line x1="650" y1="248" x2="650" y2="264" stroke="#555" stroke-width="1.2"/>
  <line x1="810" y1="248" x2="810" y2="264" stroke="#555" stroke-width="1.2"/>

  <!-- ================================================================ -->
  <!-- 03  RESEARCH TOOLS                                               -->
  <!-- ================================================================ -->

  <!-- Tavily -->
  <rect x="96" y="268" width="148" height="56" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="170" y="289" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Tavily</text>
  <text x="170" y="303" text-anchor="middle" font-size="8.5" fill="#666">Web Search &amp;</text>
  <text x="170" y="314" text-anchor="middle" font-size="8.5" fill="#666">Research</text>

  <!-- Crawl4AI -->
  <rect x="256" y="268" width="148" height="56" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="330" y="289" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Crawl4AI</text>
  <text x="330" y="303" text-anchor="middle" font-size="8.5" fill="#666">Website Crawling</text>
  <text x="330" y="314" text-anchor="middle" font-size="8.5" fill="#666">&amp; Content Extraction</text>

  <!-- Google Trends -->
  <rect x="416" y="268" width="148" height="56" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="490" y="289" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Google Trends</text>
  <text x="490" y="303" text-anchor="middle" font-size="8.5" fill="#666">Search Interest /</text>
  <text x="490" y="314" text-anchor="middle" font-size="8.5" fill="#666">Demand Signals</text>

  <!-- Similarweb -->
  <rect x="576" y="268" width="148" height="56" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="650" y="289" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Similarweb</text>
  <text x="650" y="303" text-anchor="middle" font-size="8.5" fill="#666">Traffic &amp; Competitor</text>
  <text x="650" y="314" text-anchor="middle" font-size="8.5" fill="#666">Intelligence</text>

  <!-- Meta Ad Library -->
  <rect x="736" y="268" width="148" height="56" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="810" y="289" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Meta Ad Library</text>
  <text x="810" y="303" text-anchor="middle" font-size="8.5" fill="#666">Competitor Ads</text>
  <text x="810" y="314" text-anchor="middle" font-size="8.5" fill="#666">&amp; Messaging</text>

  <!-- Converge bus from tools -->
  <line x1="170" y1="324" x2="170" y2="338" stroke="#555" stroke-width="1.2"/>
  <line x1="330" y1="324" x2="330" y2="338" stroke="#555" stroke-width="1.2"/>
  <line x1="490" y1="324" x2="490" y2="338" stroke="#555" stroke-width="1.2"/>
  <line x1="650" y1="324" x2="650" y2="338" stroke="#555" stroke-width="1.2"/>
  <line x1="810" y1="324" x2="810" y2="338" stroke="#555" stroke-width="1.2"/>
  <line x1="170" y1="338" x2="810" y2="338" stroke="#555" stroke-width="1.2"/>
  <line x1="490" y1="338" x2="490" y2="366" stroke="#444" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="504" y="360" font-size="8" fill="#888">raw data</text>

  <!-- ================================================================ -->
  <!-- 04  DATA PROCESSING                                              -->
  <!-- ================================================================ -->
  <rect x="95" y="372" width="790" height="76" rx="4" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,3"/>
  <rect x="101" y="365" width="165" height="14" fill="#fff"/>
  <text x="105" y="376" font-size="10" font-weight="bold" fill="#059669">04 · DATA PROCESSING</text>

  <!-- Extract Facts -->
  <rect x="111" y="386" width="170" height="48" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="196" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">Extract Facts</text>
  <text x="196" y="422" text-anchor="middle" font-size="8.5" fill="#555">Parse into discrete facts</text>

  <!-- Validate Sources -->
  <rect x="307" y="386" width="170" height="48" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="392" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">Validate Sources</text>
  <text x="392" y="422" text-anchor="middle" font-size="8.5" fill="#555">Cross-reference &amp; verify</text>

  <!-- Structure Data -->
  <rect x="503" y="386" width="170" height="48" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="588" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">Structure Data</text>
  <text x="588" y="422" text-anchor="middle" font-size="8.5" fill="#555">Normalize with metadata</text>

  <!-- Connect Relations -->
  <rect x="699" y="386" width="170" height="48" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="784" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">Connect Relations</text>
  <text x="784" y="422" text-anchor="middle" font-size="8.5" fill="#555">Link across entities</text>

  <!-- Horizontal arrows between steps -->
  <line x1="281" y1="410" x2="307" y2="410" stroke="#555" stroke-width="1.2" marker-end="url(#ah-sm)"/>
  <line x1="477" y1="410" x2="503" y2="410" stroke="#555" stroke-width="1.2" marker-end="url(#ah-sm)"/>
  <line x1="673" y1="410" x2="699" y2="410" stroke="#555" stroke-width="1.2" marker-end="url(#ah-sm)"/>

  <!-- Arrow 04 → 05 -->
  <line x1="490" y1="448" x2="490" y2="482" stroke="#444" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="504" y="474" font-size="8" fill="#888">structured intelligence</text>

  <!-- ================================================================ -->
  <!-- 05  BUSINESS MEMORY                                              -->
  <!-- ================================================================ -->
  <rect x="155" y="486" width="670" height="112" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="506" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">05 · BUSINESS MEMORY</text>

  <!-- MongoDB / PostgreSQL sub-box -->
  <rect x="170" y="516" width="322" height="70" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="331" y="535" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">MongoDB / PostgreSQL</text>
  <text x="331" y="551" text-anchor="middle" font-size="8.5" fill="#666">Company profile · Facts · Sources · Competitors</text>
  <text x="331" y="565" text-anchor="middle" font-size="8.5" fill="#666">Market signals · Framework results · Chat history</text>

  <!-- Vector Store sub-box -->
  <rect x="508" y="516" width="302" height="70" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="659" y="532" text-anchor="middle" font-size="8" font-weight="bold" fill="#a16207">(OPTIONAL)</text>
  <text x="659" y="549" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Vector Store</text>
  <text x="659" y="565" text-anchor="middle" font-size="8.5" fill="#666">Semantic retrieval of relevant</text>
  <text x="659" y="578" text-anchor="middle" font-size="8.5" fill="#666">documents &amp; research</text>

  <!-- Arrow 05 → 06 -->
  <line x1="490" y1="598" x2="490" y2="632" stroke="#444" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="504" y="622" font-size="8" fill="#888">retrieve relevant context</text>

  <!-- ================================================================ -->
  <!-- 06  LOOP LAUNCH FRAMEWORKS                                       -->
  <!-- ================================================================ -->
  <rect x="80" y="636" width="820" height="76" rx="4" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,3"/>
  <rect x="86" y="629" width="230" height="14" fill="#fff"/>
  <text x="90" y="640" font-size="10" font-weight="bold" fill="#e11d48">06 · LOOP LAUNCH FRAMEWORKS</text>

  <!-- Customer / ICP -->
  <rect x="96" y="650" width="148" height="48" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="170" y="670" text-anchor="middle" font-size="11" font-weight="bold" fill="#9f1239">Customer / ICP</text>
  <text x="170" y="685" text-anchor="middle" font-size="8" fill="#666">Segments &amp; pain points</text>

  <!-- Positioning -->
  <rect x="256" y="650" width="148" height="48" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="330" y="670" text-anchor="middle" font-size="11" font-weight="bold" fill="#9f1239">Positioning</text>
  <text x="330" y="685" text-anchor="middle" font-size="8" fill="#666">Messaging &amp; value prop</text>

  <!-- Market / Opp. -->
  <rect x="416" y="650" width="148" height="48" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="490" y="670" text-anchor="middle" font-size="11" font-weight="bold" fill="#9f1239">Market / Opp.</text>
  <text x="490" y="685" text-anchor="middle" font-size="8" fill="#666">TAM, trends &amp; timing</text>

  <!-- Competition -->
  <rect x="576" y="650" width="148" height="48" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="650" y="670" text-anchor="middle" font-size="11" font-weight="bold" fill="#9f1239">Competition</text>
  <text x="650" y="685" text-anchor="middle" font-size="8" fill="#666">Landscape &amp; threats</text>

  <!-- Growth / Dist. -->
  <rect x="736" y="650" width="148" height="48" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="810" y="670" text-anchor="middle" font-size="11" font-weight="bold" fill="#9f1239">Growth / Dist.</text>
  <text x="810" y="685" text-anchor="middle" font-size="8" fill="#666">Channels &amp; GTM</text>

  <!-- Arrow 06 → 07 -->
  <line x1="490" y1="712" x2="490" y2="746" stroke="#444" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="504" y="738" font-size="8" fill="#888">framework + intelligence</text>

  <!-- ================================================================ -->
  <!-- 07  CLAUDE — REASONING & DIAGNOSIS                               -->
  <!-- ================================================================ -->
  <rect x="210" y="750" width="560" height="74" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="490" y="770" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730a3">07 · AI REASONING &amp; DIAGNOSIS</text>
  <text x="490" y="790" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Claude — Reasoning &amp; Synthesis Layer</text>
  <text x="490" y="810" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Does NOT collect or store data — performs strategic reasoning on provided intelligence</text>

  <!-- Arrow 07 → 08 -->
  <line x1="490" y1="824" x2="490" y2="858" stroke="#444" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="504" y="848" font-size="8" fill="#888">strategic diagnosis</text>

  <!-- ================================================================ -->
  <!-- 08  USER INTERFACE                                               -->
  <!-- ================================================================ -->
  <rect x="245" y="862" width="490" height="60" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="490" y="882" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">08 · USER INTERFACE</text>
  <text x="490" y="900" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Strategic Output &amp; Recommendations</text>
  <text x="490" y="915" text-anchor="middle" font-size="9" fill="#555">Strategic Answers · Competitor Analysis · Market Insights · Reports · Recommendations · Sources</text>

  <!-- ================================================================ -->
  <!-- CONTINUOUS INTELLIGENCE LOOP (feedback path)                     -->
  <!-- ================================================================ -->
  <path d="M 490 922 L 490 948 L 48 948 L 48 190 L 165 190"
        fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7,4" marker-end="url(#ah-blue)"/>

  <!-- Label on left vertical -->
  <text x="34" y="580" font-size="9" font-weight="bold" fill="#2563eb" letter-spacing="1"
        transform="rotate(-90, 34, 580)">CONTINUOUS INTELLIGENCE LOOP</text>

  <!-- Annotation at bottom -->
  <text x="490" y="976" text-anchor="middle" font-size="8.5" fill="#888">New question → Retrieve existing intelligence → Identify gaps → Research if needed → Update memory → Apply framework → Generate answer</text>

  <!-- ================================================================ -->
  <!-- AGENT CONFIGURATION / INSTRUCTIONS (side panel — not runtime)    -->
  <!-- ================================================================ -->
  <rect x="950" y="126" width="250" height="200" rx="4" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="1075" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#a16207">AGENT CONFIGURATION</text>
  <text x="1075" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#a16207">/ INSTRUCTIONS</text>
  <text x="1075" y="180" text-anchor="middle" font-size="8.5" fill="#999" font-style="italic">(not a runtime component)</text>

  <line x1="968" y1="190" x2="1182" y2="190" stroke="#e5e7eb" stroke-width="1"/>

  <text x="968" y="210" font-size="9.5" fill="#555">› Agent behavior</text>
  <text x="968" y="228" font-size="9.5" fill="#555">› Research instructions</text>
  <text x="968" y="246" font-size="9.5" fill="#555">› Tool usage</text>
  <text x="968" y="264" font-size="9.5" fill="#555">› Validation rules</text>
  <text x="968" y="282" font-size="9.5" fill="#555">› Framework instructions</text>
  <text x="968" y="300" font-size="9.5" fill="#555">› Response format</text>

  <!-- Dashed connection: config → Backend -->
  <line x1="950" y1="190" x2="815" y2="190" stroke="#b45309" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ah-amber)"/>
  <text x="878" y="183" font-size="8" fill="#a16207">configures</text>

</svg>
